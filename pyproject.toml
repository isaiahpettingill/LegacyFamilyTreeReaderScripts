[project]
name = "legacy-family-tree-reader"
version = "0.2.2"
description = "Convert, merge, browse, query, and export Legacy Family Tree 9 databases"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-2.0-only"
authors = [{ name = "Isaiah Pettingill" }]
keywords = ["genealogy", "legacy-family-tree", "mdb", "gedcom", "sqlite"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Sociology :: Genealogy",
]
dependencies = [
    "openpyxl>=3.1.5",
]

[project.urls]
Homepage = "https://github.com/isaiahpettingill/LegacyFamilyTreeReaderScripts"
Repository = "https://github.com/isaiahpettingill/LegacyFamilyTreeReaderScripts"
Issues = "https://github.com/isaiahpettingill/LegacyFamilyTreeReaderScripts/issues"

[project.scripts]
legacy-family-tree = "legacy_family_tree_reader.cli:main"
mdb2sqlite = "legacy_family_tree_reader.cli:mdb2sqlite_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legacy_family_tree_reader"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
