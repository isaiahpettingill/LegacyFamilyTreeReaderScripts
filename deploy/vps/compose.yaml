name: legacy-family-tree

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
    environment:
      FAMILY_PASSWORD: "${FAMILY_PASSWORD:?FAMILY_PASSWORD must be set in deploy/vps/.env}"
      SESSION_SECRET: "${SESSION_SECRET:?SESSION_SECRET must be set in deploy/vps/.env}"
      SESSION_COOKIE_SECURE: "1"
    volumes:
      - type: bind
        source: "${DATABASE_PATH:-./data/family-tree.sqlite}"
        target: /data/family-tree.sqlite
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "8000"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).close()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --url
      - http://app:8000
      - --token
      - "${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be set in deploy/vps/.env}"
    depends_on:
      app:
        condition: service_healthy
    networks:
      frontend:
        gw_priority: 1
      backend:
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256

networks:
  frontend:
  backend:
    internal: true
